<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#0f766e">
  <title>Offline · Storvia Admin</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; background: #ffffff; color: #0f2e2a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; }
    main { max-width: 22rem; }
    svg { width: 64px; height: 64px; }
    h1 { margin: 20px 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 24px; color: #4b5563; line-height: 1.5; }
    button { min-height: 44px; padding: 0 24px; border: 0; border-radius: 8px; background: #0f766e; color: #ffffff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #0f2e2a; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#0f766e"/>
      <path d="M40 18H26a9 9 0 0 0 0 18h12a9 9 0 0 1 0 18H20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="49" cy="18" r="3.5" fill="#fff"/>
    </svg>
    <h1>You're offline</h1>
    <p>Check your connection and try again.</p>
